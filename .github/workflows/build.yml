name: Build Standalone Windows Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Speakaloud" --collect-all "customtkinter" --collect-all "pymupdf" desktop_app.py

      - name: Compress portable folder
        run: |
          Compress-Archive -Path dist/Speakaloud/* -DestinationPath dist/Speakaloud-Portable-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speakaloud-Portable-Windows-x64
          path: dist/Speakaloud-Portable-Windows-x64.zip

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Speakaloud-Portable-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
